name: Debug Tag Page (ACT GOLD長浜)

on:
  workflow_dispatch: {}

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run debug script
        run: |
          ls -la collector
          for f in collector/debug*tag.py; do
            if [ "$f" != "collector/debug_tag.py" ]; then mv "$f" collector/debug_tag.py; fi
          done
          python -m collector.debug_tag
